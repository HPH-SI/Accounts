<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Heritage Park Hotel – Invoice Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#B8860B;--gold-light:#D4A017;--gold-pale:#FFF8E7;--gold-border:#E8D5A3;
  --ink:#1A1A1A;--ink-mid:#4A4A4A;--ink-soft:#7A7A7A;
  --paper:#FAFAF8;--paper-dark:#F2F0EB;--white:#FFFFFF;
  --accent:#1B3A6B;--accent-light:#E8EEF7;
  --success:#2D6A4F;--danger:#8B1A1A;--warning:#7B4F00;
  --border:#D8D4CC;--shadow:0 2px 12px rgba(0,0,0,0.08);
  --font-display:'Playfair Display',serif;
  --font-body:'DM Sans',sans-serif;
}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:var(--font-display)}
input,select,textarea{
  font-family:var(--font-body);font-size:13px;
  border:1px solid var(--border);border-radius:6px;
  padding:7px 10px;background:var(--white);color:var(--ink);
  width:100%;outline:none;transition:border-color .2s;
  caret-color:var(--ink);
}
input,textarea{cursor:text}
select{cursor:default}
input:focus,select:focus,textarea:focus{border-color:var(--gold);caret-color:var(--ink)}
button{font-family:var(--font-body);cursor:pointer}
table{border-collapse:collapse;width:100%}
th{font-weight:500;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
@media print{
  body > #root > div > .no-print { display:none!important }
  body > #root > div > main > div:not(.print-doc-wrapper) { display:none!important }
  aside { display:none!important }
  .no-print { display:none!important }
  body { background:#fff!important }
  .print-doc { box-shadow:none!important;border:none!important;border-radius:0!important;margin:0!important }
  main { padding:0!important;margin:0!important;overflow:visible!important }
  /* Hide everything in main except the doc preview */
  .editor-left-panel { display:none!important }
  .editor-wrapper { display:block!important }
  .print-doc-wrapper { display:block!important }
}
@page{size:A4;margin:10mm}
.doc-page{background:#fff}
</style>
</head>
<body>
<div id="root">
  <div id="boot-msg" style="font-family:'DM Sans',sans-serif;color:#7A7A7A;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;text-align:center;padding:24px">
    <div style="width:30px;height:30px;border:3px solid #E8D5A3;border-top-color:#B8860B;border-radius:50%;animation:bootspin 0.8s linear infinite"></div>
    <div style="font-size:14px">Loading Invoice Manager…</div>
    <div style="font-size:11px;opacity:.7">Compiling the app in your browser. This can take a few seconds on first load.</div>
  </div>
</div>
<style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
<script>
/* Surface load/runtime failures on screen instead of leaving a silent blank page. */
(function(){
  function showError(title, detail){
    var root=document.getElementById("root");
    if(!root) return;
    root.innerHTML='<div style="font-family:\'DM Sans\',sans-serif;max-width:560px;margin:8vh auto;padding:28px;border:1px solid #E8D5A3;border-radius:10px;background:#FFF8E7;color:#1A1A1A">'
      +'<div style="font-size:18px;font-weight:600;margin-bottom:10px;color:#8B1A1A">⚠ '+title+'</div>'
      +'<div style="font-size:13px;line-height:1.6;color:#4A4A4A">'+detail+'</div>'
      +'<div style="font-size:12px;line-height:1.6;color:#7A7A7A;margin-top:14px">Try: a hard refresh (Cmd/Ctrl+Shift+R), checking your internet connection, or disabling ad/script blockers for this page. The app loads React &amp; Babel from CDNs and needs network access on first load.</div>'
      +'</div>';
  }
  window.addEventListener("error", function(e){
    // Ignore benign resource 404s for favicon etc.; report script/runtime failures.
    var msg = (e && e.message) ? e.message : "Unknown error";
    if(/Script error/i.test(msg) && !e.error) return;
    if(document.getElementById("boot-msg")){
      showError("The app failed to load", "A script error occurred while starting up:<br><br><code style=\"font-size:12px;color:#8B1A1A\">"+String(msg)+"</code>");
    }
  });
  // If nothing rendered after a generous wait, the CDNs (React/Babel) likely did not load.
  window.__bootCheck = setTimeout(function(){
    if(document.getElementById("boot-msg")){
      var missing=[];
      if(typeof React==="undefined") missing.push("React");
      if(typeof ReactDOM==="undefined") missing.push("ReactDOM");
      if(typeof Babel==="undefined") missing.push("Babel");
      if(missing.length){
        showError("Could not load required libraries",
          "These libraries failed to download: <b>"+missing.join(", ")+"</b>.<br><br>This is almost always a network/firewall issue blocking the CDN (unpkg.com / cdn.jsdelivr.net), not a problem with your data.");
      } else {
        showError("The app is taking longer than expected",
          "Required libraries loaded, but the interface has not rendered yet. A hard refresh usually fixes this.");
      }
    }
  }, 15000);
})();
</script>

/* Lines before the first "- ..." bullet are intro text; bullet lines start with "- ". */
function parseNotesForPreview(notes){
  if(!notes||!notes.trim()) return {intro:"",bullets:[],legacy:false};
  const lines = notes.split(/\r?\n/);
  const bulletStart = lines.findIndex(l=>/^\s*-\s*.*/.test(l));
  if(bulletStart===-1){
    return {intro:notes.trim(),bullets:[],legacy:true};
  }
  const intro = lines.slice(0,bulletStart).join("\n").trim();
  const bullets=[];
  for(let i=bulletStart;i<lines.length;i++){
    let t=lines[i].trim();
    if(!t) continue;
    const m=t.match(/^-\s*(.*)$/);
    if(m){
      bullets.push(m[1]!=null?m[1].trim():"");
      continue;
    }
    if(bullets.length){
      bullets[bullets.length-1]=(bullets[bullets.length-1]?bullets[bullets.length-1]+" ":"")+t;
    }
  }
  return {intro,bullets,legacy:false};
}

/* ── PDF DOWNLOAD ── */
async function downloadPDF(docRef, docNumber, docType){
  const el = docRef.current;
  if(!el) return;
  const {jsPDF} = window.jspdf;
  const canvas = await html2canvas(el, {
    scale:2, useCORS:true, backgroundColor:"#ffffff",
    logging:false, imageTimeout:0
  });
  const imgData = canvas.toDataURL("image/jpeg", 0.85);
  const pdf = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const cw = canvas.width, ch = canvas.height;
  const ratio = cw/ch;
  let imgW = pw - 20, imgH = imgW / ratio;
  if(imgH > ph - 20){ imgH = ph - 20; imgW = imgH * ratio; }
  const x = (pw - imgW)/2, y = 10;
  pdf.addImage(imgData,"JPEG",x,y,imgW,imgH,undefined,"FAST");
  const fname = (docNumber||docType||"document").replace(/[^a-zA-Z0-9_-]/g,"_");
  pdf.save(`${fname}.pdf`);
}

/* ── PDF AS BASE64 (for email attachment — lower quality to reduce file size) ── */
async function generatePdfBase64(docRef, docNumber, docType){
  const el = docRef.current;
  if(!el) return null;
  const {jsPDF} = window.jspdf;
  const canvas = await html2canvas(el, {
    scale:1.5, useCORS:true, backgroundColor:"#ffffff",
    logging:false, imageTimeout:0
  });
  const imgData = canvas.toDataURL("image/jpeg", 0.65);
  const pdf = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const ratio = canvas.width / canvas.height;
  let imgW = pw - 20, imgH = imgW / ratio;
  if(imgH > ph - 20){ imgH = ph - 20; imgW = imgH * ratio; }
  pdf.addImage(imgData,"JPEG",(pw-imgW)/2,10,imgW,imgH,undefined,"FAST");
  return btoa(pdf.output());
}

/* ── EMAIL (Resend via same-origin function — direct api.resend.com calls fail: CORS / “Failed to fetch”) ── */
/* Split a comma- or semicolon-separated address string into a trimmed array, ignoring blanks. */
function parseEmails(str){
  if(!str||!str.trim()) return [];
  return str.split(/[,;]+/).map(e=>e.trim()).filter(Boolean);
}

function getEmailApiUrl(){
  if(typeof window==="undefined") return "";
  if(window.__HPH_EMAIL_SEND_URL__) return window.__HPH_EMAIL_SEND_URL__;
  if(typeof location!=="undefined" && (location.protocol==="http:" || location.protocol==="https:")) {
    return location.origin + "/.netlify/functions/send-email";
  }
  return "";
}
async function sendViaResend({to, cc, bcc, fromEmail, docType, docNumber, toName, company, subtotal, currency, htmlBody, pdfBase64, pdfFilename}){

    html: htmlBody||`<p>Dear ${toName||"Client"},</p><p>Please find attached your ${docType}${docNumber?" #"+docNumber:""} from Heritage Park Hotel.</p><p>Total: ${currency} ${fmt(subtotal)}</p><br/><p>Best regards,<br/>Heritage Park Hotel<br/>Honiara, Solomon Islands</p>`,
    ...(pdfBase64 ? { attachments: [{ filename: pdfFilename || "document.pdf", content: pdfBase64 }] } : {})
  };
  const openMailto = () => {
    const plain = `Dear ${toName||"Client"},\n\nPlease find attached your ${docType}${docNumber?" #"+docNumber:""} from Heritage Park Hotel.\n\nTotal: ${currency} ${fmt(subtotal)}\n\nBest regards,\nHeritage Park Hotel\nHoniara, Solomon Islands`;
    window.location.href = `mailto:${encodeURIComponent(toList.join(","))}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(plain)}`;
  };
  const url = getEmailApiUrl();
  if(!url) {
    openMailto();
    return { id: "mailto" };
  }
  let resp;
  try {
    resp = await fetch(url, { method:"POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (err) {
    const m = err && err.message || "";
    if (m === "Failed to fetch" || m.indexOf("NetworkError") !== -1 || m.indexOf("fetch") !== -1) {
      openMailto();
      return { id: "mailto" };
    }
    throw err;
  }
  const text = await resp.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text || "Invalid response" }; }
  if (!resp.ok) {
    if (resp.status === 404) {
      openMailto();
      return { id: "mailto" };
    }
    const errMsg = (data && data.message) || "";
    if (
      resp.status === 500 &&
      ((data && data.code === "missing_resend_key") ||
        errMsg.indexOf("RESEND_API_KEY") !== -1 ||
        errMsg.indexOf("not configured") !== -1 ||
        errMsg.indexOf("Functions (not Build only)") !== -1)
    ) {
      openMailto();
      return { id: "mailto" };
    }
    throw new Error(errMsg || `Email failed (${resp.status})`);
  }
  return data;
}

function publicConfigUrl(){
  if(typeof location==="undefined"||!location.protocol)return"";
  if(location.protocol!=="http:"&&location.protocol!=="https:")return"";
  return location.origin + "/.netlify/functions/get-public-config";
}

/* Try both Netlify paths (function URL + /api/redirect) so a deploy mismatch does not 404. */
async function fetchPublicConfigJson(){
  const paths=["/.netlify/functions/get-public-config","/api/public-config"];
  for(const p of paths){
    const u=location.origin+p;
    try{
      const r=await fetch(u);
      if(!r.ok) continue;
      const t=await r.text();
      let cfg;
      try{ cfg=JSON.parse(t);}catch{ continue; }
      if(cfg && typeof cfg==="object") return cfg;
    }catch(e){ console.warn("get-public-config",p,e); }
  }
  return null;
}

  const lines = items.filter(i=>i.type==="line");

  /* ── Drag-and-drop reorder ── */
  const dragId=useRef(null);
  const [dragOver,setDragOver]=useState(null); // {id, after}

  const handleDragStart=(e,id)=>{
    dragId.current=id;
    e.dataTransfer.effectAllowed="move";
    /* Firefox requires data for a drag to start */
    try{e.dataTransfer.setData("text/plain",String(id));}catch(err){}
    /* Show the whole row as the drag image, not just the ⠿ handle */
    const tr=e.currentTarget.closest("tr");
    if(tr&&e.dataTransfer.setDragImage)e.dataTransfer.setDragImage(tr,20,15);
  };
  const handleDragOver=(e,id)=>{
    e.preventDefault();
    e.dataTransfer.dropEffect="move";
    if(dragId.current==null||dragId.current===id){if(dragOver)setDragOver(null);return;}
    const from=items.findIndex(i=>i.id===dragId.current);
    const to=items.findIndex(i=>i.id===id);
    const after=from>-1&&from<to; /* dragging down inserts after the hovered row */
    if(!dragOver||dragOver.id!==id||dragOver.after!==after)setDragOver({id,after});
  };
  const handleDrop=(e,targetId)=>{
    e.preventDefault();
    if(!dragId.current||dragId.current===targetId){setDragOver(null);return;}
    const from=items.findIndex(i=>i.id===dragId.current);
    const to=items.findIndex(i=>i.id===targetId);
    if(from<0||to<0){setDragOver(null);return;}
    const next=[...items];
    const [moved]=next.splice(from,1);
    next.splice(to,0,moved);
    onReorderItems&&onReorderItems(next);
    dragId.current=null;
    setDragOver(null);
  };
  const handleDragEnd=()=>{dragId.current=null;setDragOver(null);};

    id:initialDoc?.id||Date.now(),
    docType,docNumber,docDate,toName,company,phone,clientEmail,
    currency,rates,deposit,deposit2,tac,tacType,notes,eventLabel,salesperson,
    items,subtotal,balance
  };

  const handleSave=()=>onSave(docObj);

  const handlePDF=async()=>{
    setPdfLoading(true);
    try{
      // Use the hidden print version
      await downloadPDF(printDocRef, docNumber||docType, docType);
    }catch(e){console.error(e);}
    setPdfLoading(false);
  };

  const handleEmail=async()=>{
    if(!parseEmails(emailTo).length){setEmailError("Please enter at least one recipient email");return;}
    setEmailStatus("sending"); setEmailError("");
    try{
      const safeName = (docNumber||docType||"document").replace(/[^a-zA-Z0-9_-]/g,"_");
      const pdfBase64 = await generatePdfBase64(printDocRef, docNumber, docType).catch(()=>null);
      const result = await sendViaResend({
        to:emailTo,cc:emailCC,bcc:emailBCC,fromEmail,
        docType,docNumber,toName,company,subtotal,currency,
        pdfBase64,
        pdfFilename: `${safeName}.pdf`
      });
      if(result && result.id==="mailto"){
        setEmailStatus("mailto");
        setTimeout(()=>setEmailStatus("idle"),6000);
      } else {
        setEmailStatus("success");
        setTimeout(()=>setEmailStatus("idle"),5000);
      }
    }catch(e){
      setEmailStatus("error");
      setEmailError(e.message||"Failed to send");
    }
  };

  const updateItem=(id,val)=>setItems(prev=>prev.map(i=>i.id===id?val:i));
  const removeItem=(id)=>setItems(prev=>prev.filter(i=>i.id!==id));
  const reorderItems=(newItems)=>setItems(newItems);
  const addLine=()=>setItems(prev=>[...prev,emptyLine()]);
  const addGroup=()=>setItems(prev=>[...prev,emptyGroup("Group Heading")]);

  return(
    <div style={{display:"flex",gap:20,maxWidth:1120,margin:"0 auto",padding:"20px 16px",alignItems:"flex-start",minHeight:"calc(100vh - 40px)"}}>
      {/* Left */}

        <EditorCard mb={12}>
          <EditorLabelSm>Document Type</EditorLabelSm>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {DOC_TYPES.map(dt=>(
              <button key={dt} onClick={()=>setDocType(dt)} style={{
                padding:"5px 11px",borderRadius:16,fontSize:11,border:"1px solid",
                background:docType===dt?"var(--accent)":"transparent",
                color:docType===dt?"#fff":"var(--ink-mid)",
                borderColor:docType===dt?"var(--accent)":"var(--border)",cursor:"pointer"
              }}>{dt}</button>
            ))}
          </div>
        </EditorCard>

        <EditorCard title="Document Details" mb={12}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><EditorLabelSm>Doc Number</EditorLabelSm><input value={docNumber} onChange={e=>setDocNumber(e.target.value)} placeholder="AFP/HPHL/001"/></div>
            <div><EditorLabelSm>Date</EditorLabelSm><input type="date" value={docDate} onChange={e=>setDocDate(e.target.value)}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div><EditorLabelSm>Salesperson</EditorLabelSm><input value={salesperson} onChange={e=>setSalesperson(e.target.value)} placeholder="YASH"/></div>
            <div><EditorLabelSm>Event</EditorLabelSm><input value={eventLabel} onChange={e=>setEventLabel(e.target.value)} placeholder="Accommodation"/></div>
          </div>
        </EditorCard>

        <EditorCard title="Client Information" mb={12}>
          <div style={{display:"grid",gap:8}}>
            <div><EditorLabelSm>To (Name)</EditorLabelSm><input value={toName} onChange={e=>setToName(e.target.value)} placeholder="SANDRA HUGHES"/></div>
            <div><EditorLabelSm>Company</EditorLabelSm><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Australian Federal Police"/></div>
            <div><EditorLabelSm>Phone</EditorLabelSm><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+61 ..."/></div>
            <div><EditorLabelSm>Email</EditorLabelSm><input type="email" value={clientEmail} onChange={e=>setClientEmail(e.target.value)} placeholder="client@example.com"/></div>
          </div>
        </EditorCard>

        <EditorCard title="Currency & Exchange" mb={12}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:currency!=="SBD"?10:0}}>
            {CURRENCIES.map(c=>(
              <button key={c} onClick={()=>setCurrency(c)} style={{
                padding:"4px 10px",borderRadius:14,fontSize:11,border:"1px solid",
                background:currency===c?"var(--gold)":"transparent",
                color:currency===c?"#fff":"var(--ink-mid)",

        </EditorCard>

        <EditorCard title="Deposits Received" mb={12}>

            <div><EditorLabelSm>Deposit 1 (SBD)</EditorLabelSm><input type="number" value={deposit} onChange={e=>setDeposit(+e.target.value)}/></div>
            <div><EditorLabelSm>Deposit 2 (SBD)</EditorLabelSm><input type="number" value={deposit2} onChange={e=>setDeposit2(+e.target.value)}/></div>

          <div>

/* ── ANALYTICS ── */
function Analytics({docs}){
  const total=docs.reduce((s,d)=>s+d.subtotal,0);
  const paid=docs.reduce((s,d)=>s+(+d.deposit)+(+d.deposit2),0);
  const outstanding=total-paid;
  const byType=DOC_TYPES.map(t=>({type:t,count:docs.filter(d=>d.docType===t).length}));
  const recent=[...docs].sort((a,b)=>new Date(b.docDate)-new Date(a.docDate)).slice(0,10);

  const Stat=({label,value,color="var(--ink)",sub})=>(
    <div style={{background:"var(--white)",border:"1px solid var(--border)",borderRadius:9,padding:"14px 18px",flex:1}}>
      <div style={{fontSize:10,color:"var(--ink-soft)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>{label}</div>
      <div style={{fontSize:20,fontWeight:700,color,fontFamily:"var(--font-display)"}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:"var(--ink-soft)",marginTop:3}}>{sub}</div>}
    </div>
  );

  return(
    <div style={{padding:"22px 28px",maxWidth:960,margin:"0 auto"}}>
      <h2 style={{fontSize:20,marginBottom:4}}>Analytics & Reconciliation</h2>
      <div style={{color:"var(--ink-soft)",fontSize:12,marginBottom:20}}>{docs.length} document{docs.length!==1?"s":""} on record</div>
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <Stat label="Total Invoiced" value={`SBD ${fmt(total)}`} sub={`${docs.length} documents`}/>
        <Stat label="Deposits Received" value={`SBD ${fmt(paid)}`} color="var(--success)" sub="Collected"/>
        <Stat label="Outstanding" value={`SBD ${fmt(outstanding)}`} color={outstanding>0?"var(--danger)":"var(--success)"} sub="Balance due"/>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:20}}>
        {byType.map(b=>(
          <div key={b.type} style={{background:"var(--white)",border:"1px solid var(--border)",borderRadius:9,padding:"12px 16px",flex:1,textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:700,fontFamily:"var(--font-display)",color:"var(--accent)"}}>{b.count}</div>
            <div style={{fontSize:10,color:"var(--ink-soft)"}}>{b.type}</div>
          </div>
        ))}
      </div>
      <div style={{background:"var(--white)",border:"1px solid var(--border)",borderRadius:9,overflow:"hidden"}}>
        <div style={{padding:"12px 18px",borderBottom:"1px solid var(--border)",fontWeight:600,fontFamily:"var(--font-display)",fontSize:13}}>All Documents</div>
        {recent.length===0
          ?<div style={{padding:"32px",textAlign:"center",color:"var(--ink-soft)",fontSize:13}}>No documents yet.</div>
          :<table style={{fontSize:12}}>
            <thead><tr style={{borderBottom:"1px solid var(--border)"}}>
              {["#","Type","To","Company","Date","Subtotal","Deposits","Balance"].map(h=>(
                <th key={h} style={{padding:"9px 14px",textAlign:["Subtotal","Deposits","Balance"].includes(h)?"right":"left"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {recent.map(d=>(
                <tr key={d.id} style={{borderBottom:"1px solid var(--paper-dark)"}}>
                  <td style={{padding:"9px 14px",color:"var(--gold)",fontWeight:600}}>{d.docNumber||"—"}</td>
                  <td style={{padding:"9px 14px"}}><span style={{
                    background:d.docType==="Invoice"?"#E8EEF7":d.docType==="Quotation"?"#FFF8E7":"#E8F5E9",
                    color:d.docType==="Invoice"?"var(--accent)":d.docType==="Quotation"?"var(--warning)":"var(--success)",
                    padding:"2px 7px",borderRadius:8,fontSize:10,fontWeight:600
                  }}>{d.docType}</span></td>
                  <td style={{padding:"9px 14px",fontWeight:500}}>{d.toName||"—"}</td>
                  <td style={{padding:"9px 14px",color:"var(--ink-soft)"}}>{d.company||"—"}</td>
                  <td style={{padding:"9px 14px",color:"var(--ink-soft)"}}>{d.docDate||"—"}</td>
                  <td style={{padding:"9px 14px",textAlign:"right"}}>SBD {fmt(d.subtotal)}</td>
                  <td style={{padding:"9px 14px",textAlign:"right",color:"var(--success)"}}>SBD {fmt((+d.deposit)+(+d.deposit2))}</td>
                  <td style={{padding:"9px 14px",textAlign:"right",fontWeight:600,color:d.balance>0?"var(--danger)":"var(--success)"}}>

/* ── APP ── */
function App(){
  const [tab,setTab]=useState("new");
  const [docs,setDocs]=useState([]);
  const [editingDoc,setEditingDoc]=useState(null);
  const [dbStatus,setDbStatus]=useState("loading");
  const [dbErrorMsg,setDbErrorMsg]=useState("");
  const supabaseRef=useRef(null);
  const realtimeChannelRef=useRef(null);

  const rowToDoc=(row)=>{
    if(!row) return null;
    const id=typeof row.id==="string"?+row.id:row.id;
    const j=row.doc_json;
    if(j==null) return null;
    return{ ...j, id };
  };

  useEffect(()=>{
    let live=true;
    (async()=>{
      const base=publicConfigUrl();
      if(!base){ if(live){ setDbStatus("offline"); setDbErrorMsg(""); } return; }
      try{
        if(live) setDbErrorMsg("");
        /* UMD from script tag — dynamic import() + Babel can emit require() and break in-browser. */
        const supLib=typeof window!=="undefined"&&window.supabase;
        if(!supLib||typeof supLib.createClient!=="function"){
          if(live){
            setDbErrorMsg("Supabase library not loaded");
            setDbStatus("error");
          }
          return;
        }
        const cfg=await fetchPublicConfigJson();
        if(!cfg){
          if(live) setDbStatus("offline");
          return;
        }
        if(!cfg.configured||!cfg.supabaseAnonKey){ if(live) setDbStatus("offline"); return; }
        const supa=supLib.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        supabaseRef.current=supa;
        const { data, error }=await supa.from("documents").select("id, doc_json, updated_at").order("updated_at",{ ascending:false });
        if(error){
          console.error("Supabase documents:",error);
          if(live){
            setDbErrorMsg(error.message||String(error));
            setDbStatus("error");
          }
          return;
        }
        if(live && data) setDocs(data.map(rowToDoc).filter(Boolean));
        if(live) setDbStatus("ok");
        if(!live) return;
        try{
          const ch=supa
            .channel("documents-realtime")
            .on("postgres_changes",{ event:"*", schema:"public", table:"documents" },(payload)=>{
              if(!live) return;
              setDocs((prev)=>{
                if(payload.eventType==="DELETE"){
                  const raw=payload.old && payload.old.id;
                  if(raw==null) return prev;
                  const id=typeof raw==="string"?+raw:raw;
                  return prev.filter(d=>d.id!==id);
                }
                const doc=rowToDoc(payload.new);
                if(!doc) return prev;
                const i=prev.findIndex(d=>d.id===doc.id);
                if(i>=0){
                  const n=[...prev];
                  n[i]=doc;
                  return n;
                }
                return[doc,...prev];
              });
            })
            .subscribe();
          realtimeChannelRef.current=ch;
        }catch(rtErr){
          console.warn("Realtime unavailable (list still works):",rtErr);
        }
      }catch(e){
        console.error(e);
        if(live){
          setDbErrorMsg(e && e.message?e.message:String(e));
          setDbStatus("error");
        }
      }
    })();
    return()=>{
      live=false;
      const sb=supabaseRef.current;
      const ch=realtimeChannelRef.current;
      realtimeChannelRef.current=null;
      if(sb && ch) sb.removeChannel(ch);
    };
  },[]);

  const handleSave=async (doc)=>{
    setDocs(prev=>{
      const idx=prev.findIndex(d=>d.id===doc.id);
      if(idx>=0){ const n=[...prev]; n[idx]=doc; return n; }
      return [...prev, doc];
    });
    setTab("list");
    setEditingDoc(null);
    if(supabaseRef.current){
      const { error }=await supabaseRef.current.from("documents").upsert(
        { id: doc.id, doc_json: doc, updated_at: new Date().toISOString() },
        { onConflict: "id" }
      );
      if(error) console.error("Supabase save:", error);
    }
  };

  const handleDelete=async (id)=>{
    setDocs(prev=>prev.filter(d=>d.id!==id));
    if(supabaseRef.current){
      const { error }=await supabaseRef.current.from("documents").delete().eq("id", id);
      if(error) console.error("Supabase delete:", error);
    }
  };

  return(
    <div style={{display:"flex",minHeight:"100vh"}}>
      <div className="no-print">
        <Sidebar activeTab={tab} setActiveTab={t=>{if(t!=="new")setEditingDoc(null);setTab(t);}} docs={docs} dbStatus={dbStatus} dbErrorMsg={dbErrorMsg}/>
      </div>
      <main style={{flex:1,overflowY:"auto",background:"var(--paper)"}}>
        {tab==="new"&&<DocEditor onSave={handleSave} initialDoc={editingDoc} key={editingDoc?.id||"new"}/>}
        {tab==="list"&&<DocList docs={docs} onEdit={d=>{setEditingDoc(d);setTab("new");}} onDelete={handleDelete} onNew={()=>{setEditingDoc(null);setTab("new");}}/>}
        {tab==="analytics"&&<Analytics docs={docs}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
