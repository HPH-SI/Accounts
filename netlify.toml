[build]
  publish = "."
  functions = "netlify/functions"

# Site entry (no index.html; keep app filename with spaces)
[[redirects]]
  from = "/"
  to = "/HP Invoice Manager.html"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/get-public-config"
  status = 200
